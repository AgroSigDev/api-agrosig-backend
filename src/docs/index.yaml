  /users/update-profile/1:
    patch:
      summary: updateUserById
      deprecated: false
      description: >-
        ### PATCH /users/{id}


        This endpoint allows you to update the details of a specific user
        identified by their unique user ID. The request modifies user attributes
        such as their name and email address.


        #### Request Body


        The request body must be in JSON format and should contain the following
        parameters:


        - **first_name** (string): The user's first name.
            
        - **paternal_surname** (string): The user's paternal surname.
            
        - **maternal_surname** (string): The user's maternal surname.
            
        - **email** (string): The user's email address.
            

        **Example Request:**


        ``` json

        {
          "first_name": "Daniel",
          "paternal_surname": "Garcia",
          "maternal_surname": "Perez",
          "email": "juangoher@gmail.com"
        }

         ```

        #### Response Structure


        Upon a successful update, the API will return a JSON object containing
        the following fields:


        - **success** (boolean): Indicates whether the update was successful.
            
        - **data** (object): Contains the updated user information with the
        following fields:
            
            - **user_id** (integer): The unique identifier for the user.
                
            - **google_id** (string|null): The user's Google ID, if applicable.
                
            - **role_id** (integer): The role identifier associated with the user.
                
            - **first_name** (string): The updated first name of the user.
                
            - **paternal_surname** (string): The updated paternal surname of the user.
                
            - **maternal_surname** (string): The updated maternal surname of the user.
                
            - **email** (string): The updated email address of the user.
                
            - **password** (string): The user's password (may not be returned for security reasons).
                
            - **image_user** (string): The URL or path to the user's profile image.
                
            - **configured_plot** (boolean): Indicates if the user has a configured plot.
                
            - **is_active** (boolean): Indicates if the user's account is active.
                
            - **created_at** (string): Timestamp of when the user was created.
                
            - **updated_at** (string): Timestamp of the last update to the user.
                

        **Example Response:**


        ``` json

        {
          "success": true,
          "data": {
            "user_id": 0,
            "google_id": null,
            "role_id": 0,
            "first_name": "",
            "paternal_surname": "",
            "maternal_surname": "",
            "email": "",
            "password": "",
            "image_user": "",
            "configured_plot": true,
            "is_active": true,
            "created_at": "",
            "updated_at": ""
          }
        }

         ```
      tags: []
      parameters:
        - name: Content-Type
          in: header
          description: ''
          required: false
          type: string
          x-example: multipart/form-data
        - name: Authorization
          in: header
          description: ''
          required: true
          type: string
          x-example: >-
            Bearer
            eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJyb2xlX2lkIjoxLCJpYXQiOjE3NjM2OTQ1MzIsImV4cCI6MTc2MzczNzczMn0.H4f70WG4Nd_7-W8fpAXynoksbRnzZH--Ks9PbQKjFbU
